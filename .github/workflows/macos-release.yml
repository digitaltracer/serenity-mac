name: macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for updater manifest)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  build-sign-notarize:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.version }}"
          if [[ -z "${version}" ]]; then
            if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
              version="${GITHUB_REF#refs/tags/}"
            else
              version="manual-${GITHUB_RUN_NUMBER}"
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for variable in APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD MACOS_SIGNING_IDENTITY; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing required secret: $variable"
              missing=1
            fi
          done

          if [[ "$missing" -eq 1 ]]; then
            exit 1
          fi

      - name: Build release binary
        run: swift build -c release

      - name: Sign binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp .build/release/SerenityMac dist/SerenityMac
          chmod +x dist/SerenityMac
          codesign --force --timestamp --options runtime --sign "$MACOS_SIGNING_IDENTITY" dist/SerenityMac
          codesign --verify --strict --verbose dist/SerenityMac

      - name: Create distributable archive
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent dist/SerenityMac dist/SerenityMac-${{ steps.version.outputs.version }}.zip

      - name: Notarize archive
        shell: bash
        run: |
          set -euo pipefail
          xcrun notarytool submit "dist/SerenityMac-${{ steps.version.outputs.version }}.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait \
            --output-format json > dist/notary-result.json

      - name: Verify notarization result
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.status' dist/notary-result.json)" == "Accepted" ]]

      - name: Build updater manifest
        shell: bash
        run: |
          set -euo pipefail
          archive_path="dist/SerenityMac-${{ steps.version.outputs.version }}.zip"
          checksum="$(shasum -a 256 "$archive_path" | cut -d ' ' -f 1)"
          cat > dist/updater-manifest.json <<EOF_MANIFEST
          {
            "version": "${{ steps.version.outputs.version }}",
            "artifact": "SerenityMac-${{ steps.version.outputs.version }}.zip",
            "sha256": "${checksum}",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF_MANIFEST

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ steps.version.outputs.version }}
          path: |
            dist/SerenityMac
            dist/SerenityMac-${{ steps.version.outputs.version }}.zip
            dist/notary-result.json
            dist/updater-manifest.json

      - name: Attach artifacts to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SerenityMac-${{ steps.version.outputs.version }}.zip
            dist/notary-result.json
            dist/updater-manifest.json
